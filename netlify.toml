# Netlify configuration for ViralRadar.
#
# The site is plain static files: no framework, no bundler. `npm run build`
# copies public/ into dist/, writes dist/env.js from the environment variables,
# and vendors the supabase-js browser bundle so nothing loads from a CDN.
#
# Two things must be set in the Netlify UI, because they are per-site and must
# not be committed:
#   Site configuration -> Environment variables
#     SUPABASE_URL        https://<project-ref>.supabase.co
#     SUPABASE_ANON_KEY   the publishable key, never the secret one
#
# The production branch is "main". The old local-only version lives on the
# "local-sqlite" branch (tag v1-local) and is never deployed.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pinned to the version this was developed and tested with.
  NODE_VERSION = "24.11.0"
  # The site needs no optional native modules; better-sqlite3 is only used by
  # the local version and the one-off migration script.
  NPM_FLAGS = "--no-audit --no-fund"

# Hash routing means most navigation never hits the server, but a direct link
# to a path should still land on the app rather than a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# env.js carries the build's configuration. It must never be cached, or a
# redeploy that changes a key would leave old browsers pointing at nothing.
[[headers]]
  for = "/env.js"
  [headers.values]
    Cache-Control = "no-store"

# The service worker must always be revalidated, otherwise an old one can keep
# serving an old app shell indefinitely.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# The vendored library is versioned by its contents and never changes in place.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
