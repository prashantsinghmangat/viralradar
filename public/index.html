<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a78d6">
  <title>ViralRadar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%232a78d6'/><circle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='2.5'/><circle cx='16' cy='16' r='2.5' fill='white'/></svg>">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ViralRadar">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/styles.css">
  <script>
    try { var t = localStorage.getItem('vr-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/radar"><span class="logo" aria-hidden="true"></span>ViralRadar</a>
    <div class="topbar-search" id="topSearchWrap">
      <span class="ico" aria-hidden="true">🔎</span>
      <input type="text" id="topSearch" placeholder="Search this screen…" aria-label="Search this screen">
    </div>
    <div class="topbar-scan" id="scanTimeLabel"><span class="ico" aria-hidden="true">🕐</span><span>Daily scan at 7:00 AM IST</span></div>
    <button type="button" class="primary topbar-new" id="newScriptBtn" data-action="newScript">+ New script</button>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle light/dark mode" title="Toggle light/dark">◐</button>
  </header>

  <!-- Deliberately a SIBLING of the header, not a child of it. The header
       carries a backdrop-filter, which makes it the containing block for any
       position:fixed descendant — so a nav inside it would be positioned
       against the header's own box instead of the viewport. That is what
       collapsed the desktop sidebar to 16px and spilled its links across the
       page. The same trap is noted against the phone's bottom bar in
       styles.css; out here, neither can fall into it. -->
  <nav class="nav" id="nav" aria-label="Main">
    <a href="#/radar" data-route="radar"><span class="ico">📡</span><span>Radar</span></a>
    <a href="#/ideas" data-route="ideas"><span class="ico">💡</span><span>Ideas</span></a>
    <a href="#/scripts" data-route="scripts"><span class="ico">🎬</span><span>Scripts</span></a>
    <a href="#/projects" data-route="projects"><span class="ico">📁</span><span>Projects</span></a>
    <a href="#/results" data-route="results" class="nav-wide"><span class="ico">📈</span><span>Results</span></a>
    <a href="#/import" data-route="import" class="nav-wide"><span class="ico">⬇️</span><span>Import</span></a>
    <a href="#/settings" data-route="settings" class="nav-wide"><span class="ico">⚙️</span><span>Settings</span></a>
    <button type="button" class="nav-more" id="moreBtn" aria-haspopup="dialog" aria-label="More"><span class="ico">⋯</span><span>More</span></button>
  </nav>

  <!-- The "More" sheet, for the 3 screens + research packs that don't fit the
       mobile bottom bar. Desktop shows all of these in the sidebar instead,
       so this dialog is never opened there (#moreBtn is hidden at that width). -->
  <dialog id="moreSheet" class="sheet">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-body stack">
      <h2>More</h2>
      <a class="btn" href="#/results" data-more-link>📈 Results</a>
      <a class="btn" href="#/import" data-more-link>⬇️ Import</a>
      <a class="btn" href="#/settings" data-more-link>⚙️ Settings</a>
      <a class="btn" href="#/radar" data-more-link>🔍 Research packs</a>
    </div>
  </dialog>

  <main id="view" class="view" tabindex="-1"></main>

  <!-- A video transfer can take half an hour and must survive moving between
       screens, so its panel lives outside #view, which every render replaces. -->
  <div id="transfer" class="transfer" aria-live="polite" hidden></div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- Configuration written at build time, then the vendored Supabase library.
       Both are plain scripts so they have run before app.js, which is a module
       and therefore deferred. -->
  <script src="/env.js"></script>
  <script src="/vendor/supabase.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
